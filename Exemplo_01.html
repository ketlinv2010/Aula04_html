<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Exercício 01</title>
    </head>
    <body>
        <header>
            <h1 style="text-align:center;">Formulário de Cadastro</h1>
        </header>

        <!-- Conteúdo principal -->
        <main>
            <!-- Crição de Formulário -->
            <!-- action com # vai manter na mesma página ao invés de enviar para outra -->
            <!-- Method "GET" faz o envio do formulário pela URL da página -->
             <form action="#" method="GET">
                <!-- Primeiro campo -->
                 <label for="nome1">Nome</label>

                <!-- placeholder é o nome que vai ficar desntro do fomrulário antes de escrever -->
                <!-- required faz com que o campo seja preenchido obrigatoriamente -->
                 <input type="text" id="nome1" name="nome" placeholder="Digite seu nome..." required>
                 <br><br>

                <!-- Segundo campo -->
                <label for="idade1">Idade</label>
                <input type="number" id="idade1" name="idade" placeholder="Digite sua idade..." required>
                <br><br>

                <button type="submit">Enviar</button>
             </form>
        </main>
    </body>
</html>
