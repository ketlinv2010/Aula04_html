<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Exercício 01</title>
    </head>
    <body>
        <header>
            <h1 style="text-align:center;">Formulário de Cadastro</h1>
        </header>

        <!-- Conteúdo principal -->
        <main>
            <!-- Crição de Formulário -->
            <!-- action com # vai manter na mesma página ao invés de enviar para outra -->
            <!-- Method "GET" faz o envio do formulário pela URL da página -->
             <form action="#" method="GET">
                <!-- Primeiro campo -->
                 <label for="nome1">Nome</label>

                <!-- placeholder é o nome que vai ficar desntro do fomrulário antes de escrever -->
                <!-- required faz com que o campo seja preenchido obrigatoriamente -->
                 <input type="text" id="nome1" name="nome" placeholder="Digite seu nome..." required>
                 <br><br>

                <label for="sobrenome">Sobrenome</label>
                <input type="text" id="sobrenome" name="sobrenome" placeholder="digite seu sobrenome..." required>
                <br><br>

                <!-- Segundo campo -->
                <label for="idade1">Idade</label>
                <input type="number" id="idade1" name="idade" placeholder="Digite sua idade..." required>
                <br><br>

                <label for="">Data de Nascimento</label>
                <input type="date" name="data_nascimento" required>
                <br><br>

                <label for="">Selecione seu Gênero</label>
                <br>
                <label for="feminino">Feminino</label>
                <input type="radio" value="feminino" id="feminino" name="genero">
                <br>
                <label for="masculino">Masculino</label>
                <input type="radio" value="masculino" id="masculino" name="genero">
                <br>
                <label for="nao_informe">Prefiro não informar</label>
                <input type="radio" value="nao_informe" id="nao_informe" name="genero">
                <br><br>

                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="informe seu email..." required>
                <br><br>

                <label for="telefone">Telefone</label>
                <input type="tel" name="telefone" id="telefone">
                <br><br>

                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" name="endereco" placeholder="informe seu endereço..." >
                <br><br>

                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" name="informe sua cidade" placeholder="informe sua cidade" required>
                <br><br>

                <label for="">Estado</label>
                <select name="estado" id="estado">
                    <option value="Selecionar" selected disabled>Selecionar...</option>
                    <option value="São Paulo">São Paulo</option>
                    <option value="Rio de Janeiro">Rio de Janeiro</option>
                    <option value="Bahia">Bahia</option>
                </select>

                <br><br>

                <label for="cep">CEP</label>
                <input type="text" id="cep" name="cep" placeholder="informe seu cep", required>
                <br><br>

                <label for="">Usuário</label>
                <input type="text" name="usuario" placeholder="Ex.: ana.user">
                <br><br>

                <label for="senha">Senha</label>
                <br>
                <input type="password" name="senha" id="senha" placeholder="Senha forte" required>
                <br><br>

                <label for="foto">Foto de perfil</label>
                <br>
                <input type="file" id="foto" name="foto">
                <br><br>

                <label for=>Quais são seus hobbies?</label>
                <br>
                <input type="checkbox" name="ler">
                <label>Ler</label>
                
                <input type="checkbox" name="maratonar">
                <label for=>Maratonar</label>
                <br>

                <input type="checkbox" name="Correr" >
                <label for="correr">Correr</label>

                <input type="checkbox" name="jogar">
                <label for="jogar">Jogar</label>
                <br><br>

                <label for="">Nível de Educação</label>
                <select name="educacao" id="">
                    <option value="selecionar" selected disabled>Selecionar...</option>
                    <option value="fundamental">Fundamental Incompleto</option>
                    <option value="fund">Fundamental Completo</option>
                    <option value="medio">Ensino Médio Incompleto</option>
                    <option value="med">Ensino Médio Completo</option>
                    <option value="superior">Ensino Superior</option>
                </select>
                <br><br>

                <label for="profissao">Profissão</label>
                <input type="text" name="profissao" id="profissao" placeholder="informe sua profissão...">
                <br><br>

                <label for="bio">Biografia</label>
                <input type="text" name="bio" id="bio" placeholder="Descreva...">
                <br><br>

                <input type="checkbox" id="termos" name="termos" value="termos" required>
                <label for="termos">Li e concordo com os termos</label>

                <br>

                <input type="checkbox" id="receberEmail" name="receberEmail" value="receberEmail">
                <label for="receberEmail">Aceito receber notificações</label>
                <br><br>
                    

                <button type="submit">Enviar</button>
             </form>
        </main>
    </body>
</html>
